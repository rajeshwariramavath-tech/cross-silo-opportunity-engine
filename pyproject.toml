[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cross-silo-opportunity-engine"
version = "0.1.0"
description = "Surfaces cross-line-of-business opportunities in commercial real estate data by resolving entities across siloed source systems and applying governed, auditable rules."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }

[project.optional-dependencies]
dev = ["pytest>=8.0"]
llm = ["anthropic"]
api = ["fastapi", "uvicorn", "requests", "httpx"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
